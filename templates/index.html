<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <title>
        Hangman
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<main class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-bar">


        <!-- BRAND -->

        <div class="brand">


            <div class="brand-logo">
                H
            </div>


            <div class="brand-text">

                <h1>
                    HANGMAN
                </h1>

                <span>
                    WORD CHALLENGE
                </span>

            </div>


        </div>


        <!-- SCOREBOARD -->

        <div class="scoreboard">


            <!-- SCORE -->

            <div class="score-item">

                <span>
                    SCORE
                </span>

                <strong id="score">
                    —
                </strong>

            </div>


            <!-- BEST -->

            <div class="score-item">

                <span>
                    BEST
                </span>

                <strong id="best-score">
                    —
                </strong>

            </div>


            <!-- CHANCES -->

            <div class="score-item">

                <span>
                    CHANCES
                </span>

                <strong id="chances">
                    10
                </strong>

            </div>


        </div>


    </header>



    <!-- =====================================================
         GAME CARD
    ====================================================== -->

    <section class="game-card">


        <!-- GAME HEADER -->

        <div class="game-header">


            <div>

                <span class="eyebrow">
                    GUESS THE WORD
                </span>


                <h2>
                    Can you solve it?
                </h2>

            </div>


            <div class="word-info">

                <span>
                    LETTERS
                </span>


                <strong id="word-length">
                    —
                </strong>

            </div>


        </div>



        <!-- =================================================
             HANGMAN
        ================================================== -->

        <div class="hangman-container">


            <div class="hangman">


                <!-- HEAD -->

                <div
                    id="head"
                    class="hangman-part head"
                ></div>


                <!-- BODY -->

                <div
                    id="body"
                    class="hangman-part body"
                ></div>


                <!-- LEFT ARM -->

                <div
                    id="left-arm"
                    class="hangman-part left-arm"
                ></div>


                <!-- RIGHT ARM -->

                <div
                    id="right-arm"
                    class="hangman-part right-arm"
                ></div>


                <!-- LEFT LEG -->

                <div
                    id="left-leg"
                    class="hangman-part left-leg"
                ></div>


                <!-- RIGHT LEG -->

                <div
                    id="right-leg"
                    class="hangman-part right-leg"
                ></div>


            </div>


        </div>



        <!-- =================================================
             WORD
        ================================================== -->

        <div
            id="word"
            class="word"
        ></div>



        <!-- =================================================
             GUESS INPUT
        ================================================== -->

        <div class="guess-area">


            <label
                class="guess-label"
                for="guess-input"
            >
                ENTER YOUR GUESS
            </label>


            <div class="guess-box">


                <!--
                    This is a real input.

                    On mobile, tapping this opens
                    the phone's normal system keyboard.
                -->

                <input
                    id="guess-input"
                    type="text"
                    inputmode="latin"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="1"
                    placeholder="A"
                    aria-label="Enter a letter"
                >


                <button
                    id="guess-button"
                    type="button"
                >
                    GUESS
                </button>


            </div>


            <p class="keyboard-message">

                Use your
                <strong>
                    system keyboard
                </strong>

            </p>


        </div>



        <!-- =================================================
             WRONG LETTERS
        ================================================== -->

        <div class="wrong-section">


            <span class="section-title">
                WRONG LETTERS
            </span>


            <div
                id="wrong-letters"
                class="wrong-letters"
            >
                None
            </div>


        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =================================================
             RESULT POPUP
        ================================================== -->

        <div
            id="game-result"
            class="game-result hidden"
        >


            <div class="result-popup">


                <div
                    id="result-icon"
                    class="result-icon"
                >
                    🎉
                </div>


                <h2
                    id="result-title"
                >
                    You Win!
                </h2>


                <p
                    id="result-text"
                >
                    Excellent!
                </p>


                <div class="result-word">


                    <span>
                        THE WORD WAS
                    </span>


                    <strong
                        id="answer"
                    >
                        —
                    </strong>


                </div>


                <div class="final-score">


                    <span>
                        SCORE
                    </span>


                    <strong
                        id="final-score"
                    >
                        —
                    </strong>


                </div>


                <button
                    id="restart-button"
                    type="button"
                >
                    PLAY AGAIN
                </button>


            </div>


        </div>


    </section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <span>
            HANGMAN
        </span>

        <span>
            •
        </span>

        <span>
            10 CHANCES
        </span>

        <span>
            •
        </span>

        <span>
            SYSTEM KEYBOARD
        </span>

    </footer>


</main>


<!-- JAVASCRIPT -->

<script
    src="{{ url_for('static', filename='js/game.js') }}"
></script>


</body>

</html>
